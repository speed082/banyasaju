<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>반야사주</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--hanji:#f3e8ce;--paper:#fcf8ec;--ink:#2d2820;--ink-soft:#6f6147;--jade:#1d7a5e;--gold:#a8801f;--ju:#b5402f;--navy:#2c3a52;--serif:'Nanum Myeongjo',serif;--batang:'Gowun Batang',serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:var(--batang);color:var(--ink);background:radial-gradient(ellipse at top,#faf4e6,#f3e8ce 58%,#ead8b4) fixed;display:flex;justify-content:center;}
  #app{width:100%;max-width:560px;min-height:100vh;padding:28px 20px 60px;}
  .eyebrow{text-align:center;color:var(--jade);letter-spacing:.3em;font-size:12px;margin-bottom:9px;}
  .dancheong{height:3px;width:118px;margin:0 auto 20px;border-radius:2px;background:linear-gradient(90deg,var(--jade) 0 34%,var(--ju) 34% 67%,var(--gold) 67% 100%);}
  h1{font-family:var(--serif);font-weight:800;font-size:21px;text-align:center;margin:0 0 20px;}
  .card{background:var(--paper);border:1px solid rgba(45,40,32,.16);border-radius:16px;padding:18px;margin-bottom:16px;}
  .card h2{font-family:var(--serif);font-weight:700;font-size:15px;margin:0 0 13px;}
  label{font-family:var(--serif);font-size:13px;display:block;margin:0 0 6px;}
  .row{display:flex;gap:8px;align-items:flex-end;}
  .row>div{flex:1;}
  input,select{width:100%;padding:11px;border:1px solid rgba(45,40,32,.22);border-radius:10px;background:#fffdf6;color:var(--ink);font-family:var(--batang);font-size:15px;}
  input:focus,select:focus{outline:none;border-color:var(--jade);}
  button{font-family:var(--serif);font-weight:700;cursor:pointer;border:none;border-radius:10px;}
  .btn{padding:12px 16px;background:var(--jade);color:#fbf6e6;font-size:15px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}.btn:active:not(:disabled){transform:scale(.98);}
  .btn-ghost{background:#eef2ec;color:var(--ink-soft);}
  .seg{display:flex;gap:7px;}.seg .sg{flex:1;padding:11px;border:1px solid rgba(45,40,32,.18);border-radius:10px;background:var(--paper);text-align:center;font-family:var(--serif);font-size:15px;cursor:pointer;}
  .seg .sg.on{border-color:var(--jade);background:#eef6f0;color:var(--jade);}
  .field{margin-bottom:13px;}
  .status{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px;font-family:var(--serif);}
  .dot{width:12px;height:12px;border-radius:50%;background:#c8bca0;flex:none;}
  body>#dot{position:absolute;left:0;top:0;z-index:100;}
  .dot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2);}.dot.off{background:#e0524d;box-shadow:0 0 0 4px rgba(224,82,77,.18);}.dot.wait{background:var(--gold);animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.35;}}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:9px;line-height:1.6;}
  /* 명식 */
  #myeongsik{margin-top:14px;display:none;}
  .ms-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center;background:#fffdf6;border-radius:11px;padding:12px 8px;}
  .ms-grid .lab{font-family:var(--serif);font-size:11px;color:var(--ink-soft);margin-bottom:5px;}
  .ms-grid .gan,.ms-grid .ji{font-family:var(--serif);font-weight:800;font-size:23px;line-height:1.2;}
  .ms-grid .pil.self{background:#eef6f0;border-radius:9px;}
  .ms-meta{font-size:12.5px;color:var(--ink-soft);line-height:1.85;margin-top:11px;}
  .ms-meta b{color:var(--ink);font-family:var(--serif);}
  .ms-daeun{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.7;word-break:keep-all;}
  .e-목{color:#0f7a2e;background:#dcf5e2;}.e-화{color:#d11a1a;background:#ffe0dc;}.e-토{color:#9a6400;background:#fff0c2;}.e-금{color:#3d4452;background:#e6e9ef;}.e-수{color:#0b3ea8;background:#dbe7ff;}
  .ms-chart .gan,.ms-chart .ji,.ms-grid .gan,.ms-grid .ji{border-radius:10px;padding:2px 0;margin:3px 4px;}
  .personas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
  .pbtn{padding:11px 8px;border:1px solid rgba(45,40,32,.18);border-radius:11px;background:#fffdf6;text-align:center;font-family:var(--serif);font-size:14px;cursor:pointer;}
  .pbtn.on{border:2px solid var(--jade);background:#eef6f0;color:var(--jade);}.pbtn small{display:block;font-family:var(--batang);font-weight:400;font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  #reading{font-family:var(--batang);font-size:19px;line-height:1.85;margin-top:16px;}
  .free-read,.paid-read,.fu{white-space:pre-wrap;}
  .paywall{border:1.5px solid var(--gold);border-radius:16px;background:#fffdf6;padding:18px;margin-top:18px;}
  .pw-say{font-family:var(--serif);font-size:15px;line-height:1.9;margin:0 0 15px;text-align:center;}.pw-say b{color:var(--ju);}
  .doors{display:flex;flex-direction:column;gap:11px;}
  .door{border:1px solid rgba(45,40,32,.18);border-radius:13px;background:var(--paper);padding:14px;}.door.best{border:2px solid var(--gold);}
  .door .badge{display:inline-block;font-family:var(--serif);font-size:11px;color:#fbf6e6;background:var(--gold);border-radius:13px;padding:3px 10px;margin-bottom:6px;}
  .door .dn{font-family:var(--serif);font-weight:800;font-size:16px;}
  .door .dl{list-style:none;padding:0;margin:8px 0 9px;}.door .dl li{font-size:12.5px;color:var(--ink-soft);line-height:1.75;padding-left:13px;position:relative;}.door .dl li::before{content:'·';color:var(--jade);position:absolute;left:3px;font-weight:800;}.door .dl li b{color:var(--ink);}
  .door .price{font-family:var(--serif);font-weight:800;font-size:17px;color:var(--ju);text-align:right;}
  .paidtest-label{margin:18px 0 8px;text-align:center;color:var(--ink-soft);font-size:11px;}
  .paid-read{background:#f6efda;border-radius:10px;padding:13px 14px;color:#8a7a55;}
  .fudiv{margin:16px 0 7px;text-align:center;color:var(--ink-soft);font-size:12px;}
  .fu{font-size:14px;color:var(--jade);}
  .note{margin-top:22px;text-align:center;color:#a8966f;font-size:11px;line-height:1.7;}
</style>
</head>
<body>
<style>
  .phone{width:100%;max-width:430px;margin:0 auto;position:relative;background:#f3e8ce;min-height:100vh;}
  .screen{display:none;} .screen.active{display:block;}
  .imgscreen{position:relative;line-height:0;} .imgscreen>img{width:100%;display:block;}
  .hot{position:absolute;cursor:pointer;background:transparent;}
  .vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  .fbg{min-height:100vh;background:radial-gradient(ellipse at top,#faf4e6,#f3e8ce 60%,#ead8b4);padding:30px 22px 48px;}
  .dch{height:3px;width:118px;margin:0 auto 18px;border-radius:2px;background:linear-gradient(90deg,#1d7a5e 0 34%,#b5402f 34% 67%,#a8801f 67% 100%);}
  .ftitle{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;text-align:center;color:#2d2820;margin:0 0 6px;}
  .fsub{text-align:center;color:#6f6147;font-size:13px;margin:0 0 22px;line-height:1.6;}
  .ff{margin:0 0 16px;} .ff>label{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:14px;color:#2d2820;display:block;margin-bottom:7px;}
  .phone input,.phone select{width:100%;padding:13px;border:1px solid rgba(45,40,32,.22);border-radius:11px;background:#fffdf6;color:#2d2820;font-family:'Gowun Batang',serif;font-size:16px;}
  .catlay{position:absolute;left:0;top:0;width:100%;aspect-ratio:941/1672;}
  .catcard{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 3px;border-radius:12px;border:1.5px solid #c9a44e;background:linear-gradient(180deg,#fffdf4,#f6ead0);box-shadow:0 2px 6px rgba(90,60,20,.18);cursor:pointer;text-align:center;}
  .catcard b{font-family:'Nanum Myeongjo',serif;font-weight:900;font-size:20px;color:#2a1d10;line-height:1.1;}
  .catcard img{width:36px;height:36px;}
  .catcard small{font-size:12.5px;font-weight:700;color:#3d2f1c;line-height:1.25;word-break:keep-all;}
  .catcard:active{transform:scale(.97);}
  .catcard.catwide{flex-direction:row;gap:10px;justify-content:flex-start;padding:4px 14px;}
  .catcard.catwide b{white-space:nowrap;flex:none;}
  .catcard.catwide small{text-align:left;font-size:12px;}
  .catcard.catwide span{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;}
  .catcard.catwide{gap:7px;padding:4px 8px;}
  .catcard.catwide img{width:34px;height:34px;flex:none;}
  .catcard.catwide b{font-size:18px;}
  .sibox{width:100%;padding:14px 16px;border:1px solid rgba(45,40,32,.18);border-radius:11px;background:#fffdf6;text-align:left;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:16px;color:#6f6147;cursor:pointer;}
  .sibox.on{color:#2d2820;border-color:#1f6b4a;background:#eef7f0;}
  .sigrid{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;}
  .sigrid.open{display:grid;}
  .sigrid button{padding:11px 4px;border:1px solid rgba(45,40,32,.18);border-radius:10px;background:#fcf8ec;font-family:'Nanum Myeongjo',serif;cursor:pointer;line-height:1.25;}
  .sigrid button b{display:block;font-size:17px;color:#2d2820;}
  .sigrid button small{display:block;font-size:11.5px;color:#8a7a5c;margin-top:2px;}
  .sigrid button.on{border-color:#1f6b4a;background:#eef7f0;}
  .sigrid button.unk{grid-column:1/-1;}
  .two{display:flex;gap:10px;align-items:center;} .gbtn{flex:1;padding:14px;border:1px solid rgba(45,40,32,.18);border-radius:11px;background:#fcf8ec;text-align:center;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:16px;cursor:pointer;}
  .gbtn.on{border-color:#1d7a5e;background:#eef6f0;color:#1d7a5e;}
  .row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:9px;}
  .bigcta{display:block;width:100%;margin-top:16px;padding:16px;border:none;border-radius:13px;cursor:pointer;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:17px;color:#fbf6e6;background:linear-gradient(180deg,#c0392b,#9a2d22);}
  .bigcta:active{transform:scale(.99);}
  .rbg{min-height:100vh;background:radial-gradient(ellipse at top,#faf4e6,#f3e8ce 60%,#ead8b4);padding:24px 20px 48px;}
  .loadbox{text-align:center;color:#8a6f3a;font-family:'Nanum Myeongjo',serif;font-size:16px;padding:70px 10px;line-height:1.9;}
  .rmeta{text-align:center;color:#6f6147;font-size:12.5px;margin-bottom:14px;}.rmeta b{color:#b5402f;font-family:'Nanum Myeongjo',serif;}
  .rd-img{display:block;width:calc(100% + 40px);margin:26px -20px 0;aspect-ratio:16/10;object-fit:cover;}
  .rd-img.mid{margin:22px -20px 22px;}
  .rd-head{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:23px;color:#a3301f;text-align:center;margin:24px 0 12px;}
  .rd-head::before,.rd-head::after{content:'❖';color:#a8801f;font-size:11px;margin:0 8px;vertical-align:2px;}
  .rd-body{white-space:pre-wrap;font-family:'Nanum Myeongjo',serif;font-size:19px;line-height:1.85;color:#000;font-weight:800;-webkit-text-stroke:.3px #000;}
  .ms-chart{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#fffdf6;border:1px solid rgba(45,40,32,.16);border-radius:13px;padding:14px 8px;margin:2px 0 14px;}
  .ms-chart .pil{text-align:center;} .ms-chart .lab{font-family:'Nanum Myeongjo',serif;font-size:15px;font-weight:700;color:#3d3320;margin-bottom:5px;} .ms-chart .gan,.ms-chart .ji{font-family:'Nanum Myeongjo',serif;font-weight:900;font-size:36px;line-height:1.25;} .ms-chart .pil.self{background:#f6efda;border-radius:9px;}
  .oh-graph{display:flex;gap:8px;justify-content:center;align-items:flex-end;background:#fffdf6;border:1px solid rgba(45,40,32,.16);border-radius:13px;padding:14px 10px 11px;margin:2px 0 14px;}
  .ohb{flex:1;text-align:center;} .ohb-bar-wrap{height:62px;display:flex;align-items:flex-end;justify-content:center;} .ohb-bar{width:58%;min-height:4px;border-radius:4px 4px 0 0;}
  .ohb-lab{font-family:'Nanum Myeongjo',serif;font-size:12.5px;margin-top:5px;font-weight:700;}
  /* ── 선생님 선택 화면 ── */
  .selbg{min-height:100vh;background:radial-gradient(ellipse at top,#faf4e6,#f3e8ce 60%,#ead8b4);padding-bottom:8px;}
  .seltop{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 10px;}
  .seltop .t{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:17px;color:#2d2820;}
  .seltop .ic{font-size:19px;color:#9a7d4a;width:24px;text-align:center;}
  .selband{height:7px;background:linear-gradient(90deg,#1d7a5e,#b5402f 50%,#a8801f);}
  .selhead{text-align:center;padding:19px 22px 4px;}
  .selhead h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:21px;color:#2d2820;margin:0 0 7px;line-height:1.35;}
  .selhead p{color:#6f6147;font-size:13px;margin:0;}
  .selwrap{padding:12px 16px 0;}
  .recbadge{display:inline-block;font-family:'Nanum Myeongjo',serif;font-size:11.5px;color:#fbf6e6;background:linear-gradient(180deg,#c0392b,#9a2d22);border-radius:13px;padding:4px 13px;margin:6px 0 9px;}
  .feat{display:flex;gap:13px;align-items:center;background:linear-gradient(180deg,#fffdf6,#fbf3df);border:1.5px solid #c9a44e;border-radius:17px;padding:13px;cursor:pointer;box-shadow:0 4px 14px rgba(120,90,30,.13);}
  .feat:active{transform:scale(.992);}
  .feat .pf{flex:0 0 100px;height:122px;border-radius:13px;overflow:hidden;border:1px solid rgba(168,128,31,.5);}
  .feat .pf img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
  .feat .nm{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:18px;color:#b5402f;margin:0 0 3px;}
  .feat .tt{font-family:'Nanum Myeongjo',serif;font-size:13.5px;color:#2d2820;margin:0 0 8px;}
  .feat ul{list-style:none;padding:0;margin:0;}
  .feat li{font-size:11.5px;color:#6f6147;line-height:1.75;padding-left:15px;position:relative;}
  .feat li::before{content:'✦';position:absolute;left:0;color:#a8801f;font-size:10px;top:2px;}
  .selgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px;}
  .tcard{background:linear-gradient(180deg,#fffdf6,#faf2dd);border:1px solid rgba(168,128,31,.4);border-radius:15px;padding:13px 11px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;box-shadow:0 2px 8px rgba(120,90,30,.09);}
  .tcard:active{transform:scale(.99);}
  .tcard.soon{cursor:default;opacity:.82;}
  .tcard .pf{width:80px;height:80px;border-radius:50%;overflow:hidden;border:2px solid #d9b86a;margin-bottom:9px;background:#efe3c6;}
  .tcard .pf img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;}
  .tcard .pf.empty{display:flex;align-items:center;justify-content:center;font-size:30px;color:#bfa15a;}
  .tcard .nm{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:15px;color:#2d2820;margin:0 0 3px;}
  .tcard .tt{font-size:11.5px;color:#8a6f3a;line-height:1.5;margin:0 0 4px;min-height:33px;}
  .tcard .sub{font-size:10.5px;color:#9a8866;line-height:1.5;margin:0 0 10px;min-height:30px;}
  .tcard .pick{font-family:'Nanum Myeongjo',serif;font-size:12.5px;font-weight:700;color:#fbf6e6;background:linear-gradient(180deg,#c0392b,#9a2d22);border-radius:9px;padding:7px 0;width:100%;}
  .tcard.soon .pick{background:#b9a888;}
  .selnote{margin:17px 16px 0;background:linear-gradient(180deg,#7a2018,#5e1812);border-radius:13px;padding:13px 16px;text-align:center;color:#f3d9a8;font-size:12px;line-height:1.7;font-family:'Nanum Myeongjo',serif;}
  .selnav{display:flex;justify-content:space-around;align-items:center;border-top:1px solid rgba(168,128,31,.3);margin-top:16px;padding:9px 0 6px;background:rgba(255,253,246,.55);}
  .selnav>div{font-size:10px;color:#9a8866;text-align:center;}
  .selnav>div .ni{display:block;font-size:16px;margin-bottom:2px;color:#b08a44;}
  .selnav>div.cur,.selnav>div.cur .ni{color:#b5402f;}
  /* ── 템플릿 상담실(원장 외) ── */
  .offT{position:relative;min-height:100vh;background:radial-gradient(ellipse at top,#faf4e6,#f3e8ce 60%,#ead8b4);padding-bottom:30px;}
  .offback{position:absolute;top:12px;left:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(40,20,10,.42);color:#fff;border:none;font-size:21px;cursor:pointer;}
  .offhero{position:relative;width:100%;aspect-ratio:1/1.12;overflow:hidden;}
  .offhero>img,.offhero>video{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;background:#1a1008;}
  .offhero .ov{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 15px;background:linear-gradient(180deg,transparent,rgba(45,22,10,.8));}
  .offhero .ov .nm{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:21px;color:#fff7e6;margin:0 0 3px;}
  .offhero .ov .tt{font-size:13.5px;color:#f0dcb4;margin:0;}
  .offbody{padding:17px 18px 0;}
  .offfeat{background:linear-gradient(180deg,#fffdf4,#f7ebcf);border:1.5px solid #c9a44e;border-radius:18px;padding:20px 18px 18px;box-shadow:0 6px 18px rgba(90,60,20,.18);}
  .offfeat h3{font-family:'Nanum Myeongjo',serif;font-weight:900;font-size:21px;color:#a3301f;text-align:center;margin:0 0 14px;letter-spacing:.04em;}
  .offfeat h3::before,.offfeat h3::after{content:'✿';color:#c9a44e;font-size:15px;margin:0 8px;}
  .offfeat ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .offfeat li{font-family:'Nanum Myeongjo',serif;font-size:18px;font-weight:700;color:#2e2214;line-height:1.5;padding:12px 14px 12px 48px;position:relative;background:#fff;border:1px solid rgba(201,164,78,.55);border-radius:12px;}
  .offfeat li::before{content:'';position:absolute;left:14px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8c66a,#a3301f);box-shadow:0 1px 4px rgba(0,0,0,.3);}
  /* ── 상단 선생님 자동 슬라이드(신명타로식) ── */
  #sel-slide{position:relative;width:100%;height:218px;border-radius:16px;overflow:hidden;border:1.5px solid #c9a44e;cursor:pointer;box-shadow:0 5px 16px rgba(120,90,30,.18);margin-bottom:14px;}
  #sel-slide .ss-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;opacity:0;transition:opacity .6s ease;}
  #sel-slide .ss-img.on{opacity:1;}
  #sel-slide .ss-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,4,.1),transparent 32%,transparent 52%,rgba(20,10,4,.72));}
  #sel-slide .ss-badge{position:absolute;left:11px;top:10px;font-family:'Nanum Myeongjo',serif;font-size:11px;color:#fbf6e6;background:linear-gradient(180deg,#c0392b,#9a2d22);border-radius:11px;padding:3px 10px;box-shadow:0 1px 4px rgba(0,0,0,.25);}
  #sel-slide .ss-cap{position:absolute;left:14px;bottom:12px;}
  #sel-slide .ss-nm{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:19px;color:#fff7e6;text-shadow:0 1px 5px rgba(0,0,0,.65);}
  #sel-slide .ss-tt{font-size:12.5px;color:#f4e2bc;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.65);}
  #sel-slide .ss-dots{position:absolute;right:11px;bottom:14px;display:flex;gap:5px;}

function birth8In(el){
  el.value=el.value.replace(/\D/g,'').slice(0,8);
  const v=el.value, Y=document.getElementById('year'), M=document.getElementById('month'), D=document.getElementById('day');
  Y.value='';M.value='';D.value='';
  if(v.length!==8) return;
  const y=+v.slice(0,4), m=+v.slice(4,6), d=+v.slice(6,8);
  const ok=y>=1900&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=new Date(y,m,0).getDate();

  Y.value=y; M.value=String(m); D.value=String(d);
}

let SAJU=null, FACTS=null, META=null;
async function computeSaju(){
  const y=+document.getElementById('year').value, mo=+document.getElementById('month').value, d=+document.getElementById('day').value;
  if(!y||!mo||!d){ alert('생년월일을 넣어주세요'); return; }
  if(!sel.gender){ alert('성별을 골라주세요'); return; }
  const unknown=document.getElementById('unknown').checked;
  const t=document.getElementById('time').value;
  let hour, minute;
  if(!unknown && t){ const p=t.split(':'); hour=+p[0]; minute=+p[1]; }
  const input={ y,mo,d,hour,minute, gender: sel.gender==='남'?'male':'female', calendar: sel.cal, isLeapMonth:document.getElementById('leap').checked };
  try{ const r=await fetch('/api/saju',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)}); if(!r.ok) throw new Error('HTTP '+r.status); SAJU=await r.json(); }catch(e){ alert('계산 오류: '+e.message); return; }
  META={ name:document.getElementById('name').value.trim()||'손님', gender: sel.gender, cal: sel.cal, y,mo,d, hour, unknown, cat:document.getElementById('cat').value,
    birthInfo:`${sel.cal==='lunar'?'음력':'양력'} ${y}년 ${mo}월 ${d}일${unknown||hour===undefined?' (시 모름)':' '+String(hour).padStart(2,'0')+':'+String(minute||0).padStart(2,'0')}` };
  FACTS=factsFromSaju(SAJU);
  renderMyeongsik(SAJU);
  document.getElementById('gen').disabled = !connected;
}
function factsFromSaju(s){
  const P=s.fourPillars, fe=s.fiveElements;
  const cnt={목:0,화:0,토:0,금:0,수:0};
  const chars=[[P.year.gan,1],[P.year.ji,0],[P.month.gan,1],[P.month.ji,0],[P.day.gan,1],[P.day.ji,0]];
  if(P.hour){chars.push([P.hour.gan,1],[P.hour.ji,0]);}
  chars.forEach(c=>{const oh=c[1]?CH_OH[c[0]]:JI_OH[c[0]]; if(oh)cnt[oh]++;});
  const ohaengCount='목'+cnt.목+'개 화'+cnt.화+'개 토'+cnt.토+'개 금'+cnt.금+'개 수'+cnt.수+'개';
  const en=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const strong=en[0][0], weak=en[en.length-1][0];
  const strongList=en.filter(e=>e[1]>=2).map(e=>e[0]+'('+e[1]+'개)').join(', ')||en[0][0]+'('+en[0][1]+'개)';
  const weakList=en.filter(e=>e[1]===0).map(e=>e[0]).join(', ')||en[en.length-1][0];
  const yong=s.yongsinGisin&&s.yongsinGisin.yongsin||'';
  const tg=s.tenGods||{}; const sx=p=>p?((p.gan||'')+'/'+(p.ji||'')):'(시 모름)';
  const sipsin='년 '+sx(tg.year)+' · 월 '+sx(tg.month)+' · 일 '+sx(tg.day)+' · 시 '+sx(tg.hour);
  const _ss=[];
  ['year','month','day','hour'].forEach(k=>{const a=s.extendedSinsal&&s.extendedSinsal[k]; if(Array.isArray(a))a.forEach(x=>_ss.push(String(x).replace(/\s*\(.*\)\s*/,'').trim()));});
  (s.sinsal||[]).forEach(x=>_ss.push(String(x).replace(/\s*\(.*\)\s*/,'').trim()));
  if(s.gongmang&&s.gongmang.length)_ss.push('공망');
  const _sc={}; _ss.forEach(n=>{if(n)_sc[n]=(_sc[n]||0)+1;});
  const sinsal=Object.entries(_sc).sort((a,b)=>b[1]-a[1]).map(e=>e[1]>1?e[0]+'×'+e[1]+'개':e[0]).join(', ')||'두드러진 살 없음';
  const ilju=P.day.gan+P.day.ji;
  const _gj=[['년',P.year],['월',P.month],['일',P.day]]; if(P.hour)_gj.push(['시',P.hour]);
  const ganyeojidong=_gj.filter(x=>CH_OH[x[1].gan]===JI_OH[x[1].ji]).map(x=>x[0]+'주('+x[1].gan+x[1].ji+')').join(', ')||'없음';
  const yongDae=s.daeun.filter(x=>CH_OH[x.gan]===yong||JI_OH[x.ji]===yong).map(x=>x.startAge+'세 '+x.gan+x.ji).join(', ')||'대운 중 용신 약함';
  return { myeongsik:`년주 ${P.year.gan}${P.year.ji} · 월주 ${P.month.gan}${P.month.ji} · 일주 ${P.day.gan}${P.day.ji} · 시주 ${P.hour?P.hour.gan+P.hour.ji:'(시 모름)'}`,
    ilgan:`${P.day.gan}(${CH_OH[P.day.gan]})`, gangyak:(s.dayMasterStrength&&s.dayMasterStrength.level)||'-',
    ohaeng:ohaengCount, strong, weak, strongList, weakList, cntObj:cnt, yongsin:yong, yongDae, sipsin, sinsal, ilju, ganyeojidong };
}

function renderFree(free,paid){
  const parts=free.split(/(?=【)/);
  let html='';
  parts.forEach(seg=>{
    const m=seg.match(/^【\s*(.+?)\s*】([\s\S]*)$/);
    if(m){
      html+=rdImg('');
      html+='<div class="rd-head">'+esc(m[1])+'</div>';
      if(/만세력|타고난 사주/.test(m[1])) html+=sajuChartHTML();
      if(/오행/.test(m[1])) html+=ohaengGraphHTML();
      const b=m[2].trim(); if(b) html+=rdBody(b,paid);
    } else if(seg.trim()){ html+=rdBody(seg.trim(),paid); }
  });
  return html;
}

// 신명식 선생님 선택 — 페이드 히어로 + 2×2 카드. 진짜 선생님 이름/사진으로.
function buildNewSelect(){
  const DISP={
    // face=카드용 얼굴 크롭(크게), hero=큰 슬라이드용 원본, pos=히어로 얼굴 위치(선생님별)
    // intro=히어로 밑 소개글(초안 — 운영자가 숫자/문구 수정 가능). 박사·스님은 히어로를 얼굴크롭으로(더 크게·위로)
    '큰스님': {name:'법운 큰스님', career:'수행 60년 노승의 업과 인연 풀이', tag:'60년 수행 노승', intro:'전생 업과 이생 복을 꿰뚫는 묵직한 법문', face:'큰스님얼굴.png', hero:'큰스님네모.png', pos:'50% 20%'},
    '젊은스님':{name:'도현스님', career:'요즘 세상을 아는 젊은 스님의 사주 상담',  tag:'밝고 편안한 요즘 스님', intro:'직장·연애·돈 고민, 부처님 지혜로 쉽게 풀어드려요', face:'젊은스님얼굴.png', hero:'젊은스님네모.png', pos:'50% 24%'},
    '선승':   {name:'혜공선사', career:'참선 30년 선승의 직관 풀이',       tag:'참선·한마디로 비추는 선승', intro:'군더더기 없는 한마디로 집착과 번뇌의 뿌리를 비춘다', face:'선승얼굴.png', hero:'선승네모.png', pos:'50% 24%'},
    '스님':   {name:'해원스님', career:'수행 40년 비구니 스님의 마음 상담',      tag:'마음·인생 상담',  intro:'지친 마음을 어루만지고 다시 일어설 힘을 드려요', face:'스님얼굴.png', hero:'스님얼굴.png', pos:'50% 30%'},
  };
  const order=['큰스님','젊은스님','선승','스님'];
  const list=order.filter(k=>DISP[k]).map(k=>({key:k,...DISP[k]}));
  const slidesEl=document.getElementById('nsel-slides');
  const thumbs=document.getElementById('nsel-thumbs');
  const nmEl=document.getElementById('nsel-name'),carEl=document.getElementById('nsel-career'),introEl=document.getElementById('nsel-intro'),cta=document.getElementById('nsel-cta');
  if(!slidesEl||!thumbs||!cta) return;
  list.forEach(t=>{const T=TEACHERS.find(x=>x.key===t.key);if(T&&T.video)t.video=T.video;});
  slidesEl.innerHTML=list.map((t,i)=>'<div class="nsel-slide'+(i===0?' on':'')+'">'+(t.video?'<video src="'+t.video+'" poster="'+t.hero+'" muted playsinline preload="auto" style="object-position:'+t.pos+'"></video>':'<img src="'+t.hero+'" alt="'+t.name+'" style="object-position:'+t.pos+'">')+'</div>').join('');
  thumbs.innerHTML=list.map((t,i)=>'<div class="nsel-thumb'+(i===0?' on':'')+'"><div class="nsel-pic"><img src="'+t.face+'" alt=""></div><div class="nsel-tx"><div class="nsel-tn">'+t.name+'</div><div class="nsel-tt">'+t.tag+'</div></div></div>').join('');
  const slides=slidesEl.querySelectorAll('.nsel-slide'),ths=thumbs.querySelectorAll('.nsel-thumb');
  let cur=0,auto=true;
  const render=n=>{slides[cur].classList.remove('on');ths[cur].classList.remove('on');cur=n;slides[cur].classList.add('on');ths[cur].classList.add('on');nmEl.textContent=list[cur].name;carEl.textContent=list[cur].career;if(introEl)introEl.textContent=list[cur].intro||'';var hon=list[cur].name.slice(-1)==='님'?list[cur].name:list[cur].name+'님';cta.textContent=hon+'께 무료 사주 보기';};
  let tmr=null;
  const play=()=>{clearTimeout(tmr);slides.forEach((sl,i)=>{const v=sl.querySelector('video');if(v&&i!==cur){v.pause();v.onended=null;}});
    const v=slides[cur].querySelector('video');
    if(v){v.currentTime=0;v.onended=()=>{if(auto){render((cur+1)%list.length);play();}};const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{tmr=setTimeout(()=>{if(auto){render((cur+1)%list.length);play();}},2600);});}
    else tmr=setTimeout(()=>{if(auto){render((cur+1)%list.length);play();}},2600);};
  render(0); play();
  ths.forEach((el,i)=>el.onclick=()=>{auto=false;render(i);play();});
  cta.onclick=()=>selTeacher(list[cur].key);
}
function buildFeatSlide(){
  const el=document.getElementById('feat-slide'); if(!el) return;
  el.innerHTML=TEACHERS.map((t,i)=>'<div class="fs-slide'+(i===0?' on':'')+'"><img src="'+(t.slide||t.img)+'" alt="'+t.name+'"></div>').join('')
    +'<div class="fs-dots">'+TEACHERS.map((t,i)=>'<i class="'+(i===0?'on':'')+'"></i>').join('')+'</div>';
  const slides=el.querySelectorAll('.fs-slide'),dots=el.querySelectorAll('.fs-dots i');
  let cur=0;
  const show=n=>{slides[cur].classList.remove('on');dots[cur].classList.remove('on');cur=n;slides[cur].classList.add('on');dots[cur].classList.add('on');};
  setInterval(()=>show((cur+1)%TEACHERS.length),2500);
  el.onclick=()=>selTeacher(TEACHERS[cur].key);
}
function buildGate(){
  const stage=document.getElementById('sg-stage'),thumbs=document.getElementById('sg-thumbs');
  const nm=document.getElementById('sg-name'),cr=document.getElementById('sg-career'),cta=document.getElementById('sg-cta');
  const short={'큰스님':'큰스님','젊은스님':'젊은스님','선승':'선승','스님':'해원스님'};
  stage.innerHTML=TEACHERS.map((t,i)=>'<div class="sg-slide'+(i===0?' active':'')+'"><img src="'+t.img+'" alt=""></div>').join('');
  thumbs.innerHTML=TEACHERS.map(t=>'<div class="sg-thumb"><div class="sg-pic"><img src="'+t.img+'" alt=""></div><div class="sg-lbl">'+(short[t.key]||t.name)+'</div><div class="sg-tag">'+(t.sub||t.exp||'')+'</div></div>').join('');
  const slides=stage.querySelectorAll('.sg-slide'),ths=thumbs.querySelectorAll('.sg-thumb');
  let cur=-1,auto=true;
  const render=n=>{ if(cur>=0){slides[cur].classList.remove('active');ths[cur].classList.remove('on');} cur=n; slides[cur].classList.add('active');ths[cur].classList.add('on'); nm.textContent=TEACHERS[cur].name; cr.textContent=TEACHERS[cur].title; };
  render(0);
  setInterval(()=>{ if(auto) render((cur+1)%TEACHERS.length); },2000);
  ths.forEach((el,i)=>el.onclick=()=>{ auto=false; render(i); });
  cta.onclick=()=>selTeacher(TEACHERS[cur].key);
}
function selTeacher(key){ const t=TEACHERS.find(x=>x.key===key); if(!t) return; if(!t.ready){ alert(t.name+' 선생님은 곧 만나요 🙏 (준비 중)'); return; } persona=key; renderOfficeT(t); goScreen('s-officeT'); }
function renderOfficeT(t){
  document.getElementById('officeT-body').innerHTML =
    '<div class="offhero">'+(t.video?'<video src="'+t.video+'" poster="'+t.img+'" autoplay loop muted playsinline preload="auto"></video>':'<img src="'+t.img+'" alt="">')+'<div class="ov"><div class="nm">'+t.name+'</div><div class="tt">'+t.title+'</div></div></div>'
   +'<div class="offbody"><div class="offfeat"><h3>스님의 상담</h3><ul>'
   +(t.bullets||[t.sub||'깊이 있는 정통 사주 해석']).map(b=>'<li>'+b+'</li>').join('')
   +'</ul></div>'
   +'<button class="bigcta" style="margin-top:18px" onclick="toInput()">무료 사주 보기 ›</button>'
   +'<p style="text-align:center;color:#9a8866;font-size:11px;margin-top:13px">한 가지 고민, 무료로 사주를 펼쳐드려요</p></div>';
  const ov=document.querySelector('#officeT-body .offhero video'); if(ov){ ov.muted=true; ov.currentTime=0; const pr=ov.play(); if(pr&&pr.catch) pr.catch(()=>{}); }
}

function inputNext(){
  if(!document.getElementById('name').value.trim()){alert('이름을 입력해주세요');return;}

async function runReading(){
  const out=document.getElementById('reading');
  await computeSaju();
  if(!FACTS){ out.innerHTML='<div class="loadbox">사주 계산에 문제가 생겼어요.<br/>생년월일·성별을 다시 확인해주세요.</div>'; return; }
  document.getElementById('rmeta').innerHTML=(META.name||'손님')+' 님 · <b>'+(META.cat||'')+'</b> · '+esc(META.birthInfo||'');
  out.innerHTML='<div class="loadbox">선생님이 '+esc(META.name||'')+'님의 사주를 펼치는 중…<br/><span style="font-size:13px;color:#a8966f">잠시만 기다려 주세요</span></div>';
  if(!connected){ out.innerHTML='<div class="loadbox">연결이 안 됐어요. 잠시 뒤 다시 시도해 주세요.</div>'; return; }
  try{ renderReading(await callGemini({kind:'free'})); }
  catch(e){ out.innerHTML='<div class="loadbox">오류: '+esc(e.message)+'</div>'; }
}
